spring:
  application:
    name: nurse-at-home
  cloud:
    config:
      uri: https://config-service.prod:80
      enabled: false
  profiles:
    active: local


server:
  port: 8081
  forward-headers-strategy: framework
  error:
    include-message: always
  servlet:
    context-path: /nurse-at-home

management:
  endpoints:
    web:
      exposure:
        include: refresh, health, info